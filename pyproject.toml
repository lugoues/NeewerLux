[project]
name = "neewerlux"
version = "1.2.0"
description = "Headless Neewer LED light control: BLE driver, keyframe animation engine, HTTP API and web dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "poizenjam" }]
keywords = ["neewer", "bluetooth", "ble", "lighting", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Networking",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

# NeewerLux is a headless service. bleak talks to the lights, the standard library
# serves the HTTP API and web dashboard, and there is no GUI toolkit at all.
dependencies = [
    "bleak>=0.22,<4",
]

[project.urls]
Homepage = "https://github.com/poizenjam/NeewerLux"
Changelog = "https://github.com/poizenjam/NeewerLux/blob/main/CHANGELOG.md"

[dependency-groups]
# Used by the release workflow to build the Windows executable.
build = ["pyinstaller>=6.10"]

[tool.uv]
# NeewerLux is a flat-layout script application, not an installable package.
# This keeps uv from trying to build a wheel for the project itself while
# still resolving and locking its dependencies.
package = false
